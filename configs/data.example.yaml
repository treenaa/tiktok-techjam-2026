# Example dataset configuration (src/data/config.py).
# Copy to configs/data.yaml and edit the roots -- do not hardcode paths in code.
#
#   from src.data import build_from_config
#   splits = build_from_config("configs/data.yaml")

seed: 42

ratios:
  train: 0.70
  val: 0.15
  test: 0.15

# Splitting happens over these groups, never over individual files, so every
# transformed derivative of an image stays on one side of the split.
group_keys: [source_id]

# Preserve this distribution across splits. Use [dataset, label] when pooling
# corpora of very different sizes.
stratify_keys: [label]

# Trainable corpora. Pooled, then split by source_id.
datasets:
  - name: cifake
    adapter: cifake
    root: /data/cifake

  - name: wildfake
    adapter: wildfake
    root: /data/wildfake
    generator_depth: 0        # first dir under fake/ names the generator

  - name: sid_set
    adapter: sid_set
    root: /data/SID_Set
    # SID_Set is 3-class; synthetic and tampered both map to label 1.

# DEMONSTRATION ONLY -- never trained or model-selected on (project rule 11.B).
# These are returned as a separate "demo" split; the protected-data guard in
# validate_splits fails loudly if they ever appear in train/val/test.
demo:
  - name: coco_val2017
    adapter: folder
    root: /data/coco/val2017
    fixed_label: 0            # all real (4998 images)

  - name: dalle_advanced
    adapter: folder
    root: /data/dalle_advanced
    fixed_label: 1            # all AIGC (8843 images)
