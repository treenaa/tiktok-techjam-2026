# CLIP ViT-B/16 linear probe
# Phase-1 baseline. Everything below `model:` is copied verbatim from
# configs/_shared.yaml -- only `model:` may differ between baselines.
# Verify with:  python -m src.data.audit_cli compare configs/baseline_*.yaml
name: baseline_clip

seed: 42

data:
  seed: 42
  ratios: {train: 0.70, val: 0.15, test: 0.15}
  group_keys: [source_id]
  stratify_keys: [label]
  datasets:
    - {name: cifake,   adapter: cifake,   root: /data/cifake}
    - {name: wildfake, adapter: wildfake, root: /data/wildfake, generator_depth: 0}
    - {name: sid_set,  adapter: sid_set,  root: /data/SID_Set}
  demo:
    - {name: coco_val2017,   adapter: folder, root: /data/coco/val2017,   fixed_label: 0}
    - {name: dalle_advanced, adapter: folder, root: /data/dalle_advanced, fixed_label: 1}

training:
  epochs: 10
  batch_size: 32
  optimizer: adamw
  lr: 0.0003
  weight_decay: 0.01
  loss: bce_with_logits
  freeze_backbone: true          # Phase 1: linear probe only, so the comparison
                                 # measures the representation, not fine-tuning
  augment: none                  # Phase 1 has no robustness training yet
  consistency_weight: 0.0
  early_stopping:
    monitor: val_auroc
    patience: 3
  num_workers: 4

evaluation:
  metrics: [auroc, accuracy, f1, precision, recall, specificity, fpr]
  transforms: all                # all 20 official named transforms
  primary_metric: val_auroc      # model selection uses VAL, never test
  threshold_source: val          # rule 11.D

model:
  backbone: clip_vit_b16
  pretrained: openai/clip-vit-base-patch16
  normalization: clip
  image_size: 224
  head: linear
  forensic_branch: false
