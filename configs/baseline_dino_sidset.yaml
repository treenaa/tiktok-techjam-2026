name: baseline_dino_sidset

seed: 42

data:
  seed: 42
  group_keys: [source_id]
  stratify_keys: [label]
  datasets:
    - {name: sid_set, adapter: sid_set, root: /content/tiktok-techjam/data/sid_set}
  demo: []

training:
  epochs: 10
  batch_size: 32
  optimizer: adamw
  lr: 0.0003
  weight_decay: 0.01
  loss: bce_with_logits
  freeze_backbone: true
  augment: none
  consistency_weight: 0.0
  early_stopping:
    monitor: val_auroc
    patience: 3
  num_workers: 2

evaluation:
  metrics: [auroc, accuracy, f1, precision, recall, specificity, fpr]
  transforms: all
  primary_metric: val_auroc
  threshold_source: val

model:
  backbone: dinov2_vitb14
  pretrained: facebook/dinov2-base
  normalization: imagenet
  image_size: 224
  head: linear
  forensic_branch: false
