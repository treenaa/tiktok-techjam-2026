name: robust_dino_fusion

seed: 42

data:
  seed: 42
  ratios: {train: 0.70, val: 0.15, test: 0.15}
  group_keys: [source_id]
  stratify_keys: [label]
  datasets:
    - {name: cifake,   adapter: cifake,   root: /content/tiktok-techjam/data/cifake}
  demo: []

training:
  epochs: 10
  batch_size: 32
  optimizer: adamw
  lr: 0.0003
  weight_decay: 0.01
  loss: bce_with_logits
  freeze_backbone: true
  augment: competition          # turns on paired clean/transformed training
  clean_loss_weight: 1.0
  augmented_loss_weight: 1.0
  consistency_weight: 0.5       # penalizes clean vs transformed prediction drift
  early_stopping:
    monitor: val_auroc
    patience: 3
  num_workers: 2

evaluation:
  metrics: [auroc, accuracy, f1, precision, recall, specificity, fpr]
  transforms: all
  primary_metric: val_auroc
  threshold_source: val

model:
  backbone: dinov2_vitb14
  pretrained: facebook/dinov2-base
  normalization: imagenet
  image_size: 224
  head: linear
  forensic_branch: true         # enables the FFT forensic branch
